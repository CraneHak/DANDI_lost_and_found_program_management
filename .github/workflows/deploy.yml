name: 백엔드 배포

on:
  push:
    branches: [main]
    paths-ignore:
      - "crawler/**"
      - "**.md"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# 연달아 푸시해도 배포는 한 번에 하나씩
concurrency:
  group: prod-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  BUCKET: dandi-deploy-772667775117
  INSTANCE_ID: i-0e28f0a3ab4304000
  ROLE_ARN: arn:aws:iam::772667775117:role/dandi-github-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 테스트 + 빌드
        run: |
          chmod +x gradlew
          ./gradlew clean test bootJar --no-daemon

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: jar 업로드
        run: |
          PREFIX="backend/${GITHUB_SHA}"
          JAR=$(ls build/libs/*.jar | grep -v plain | head -1)
          aws s3 cp "$JAR" "s3://$BUCKET/$PREFIX/app.jar" --only-show-errors
          aws s3 cp scripts/deploy/server-deploy.sh "s3://$BUCKET/$PREFIX/deploy.sh" --only-show-errors
          echo "PREFIX=$PREFIX" >> "$GITHUB_ENV"

      - name: 서버 교체 + 헬스체크 (실패 시 자동 롤백)
        run: |
          TAG="${GITHUB_SHA::7}"
          CMD="aws s3 cp s3://$BUCKET/$PREFIX/deploy.sh /tmp/dandi-deploy.sh --only-show-errors --region $AWS_REGION && bash /tmp/dandi-deploy.sh $BUCKET $PREFIX/app.jar $TAG"
          PARAMS=$(jq -nc --arg c "$CMD" '{commands: [$c]}')
          CID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $TAG" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          echo "SSM command: $CID"

          for _ in $(seq 1 60); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; esac
            break
          done

          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          echo "최종 상태: $STATUS"
          [ "$STATUS" = "Success" ]
